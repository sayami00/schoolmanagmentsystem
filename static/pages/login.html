<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EAMS</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <button type="button" class="icon-btn theme-toggle theme-corner" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="i-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.3 22A10 10 0 0 1 9.4 2.4a1 1 0 0 1 1.2 1.3 8 8 0 0 0 9.7 9.7 1 1 0 0 1 1.3 1.2A10 10 0 0 1 12.3 22z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 7a5 5 0 1 0 5 5 5 5 0 0 0-5-5zM11 1h2v3h-2zm0 19h2v3h-2zM3.5 4.9l1.4-1.4 2.1 2.1-1.4 1.4zm13.6 13.6 1.4-1.4 2.1 2.1-1.4 1.4zM1 11h3v2H1zm19 0h3v2h-3zM3.5 19.1l2.1-2.1 1.4 1.4-2.1 2.1zM17.1 5.6l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg></button>
  <main class="login-wrap">
    <div class="card login-card">
      <div class="brand"><span class="brand-mark">EA</span><span>Employee &amp; Attendance</span></div>
      <h1>Sign in</h1>
      <p class="muted">Admin and HR staff only.</p>
      <form id="login-form" novalidate>
        <p class="form-error hidden" role="alert"></p>
        <label class="field">Username
          <input name="username" autocomplete="username" required maxlength="50" autofocus>
        </label>
        <label class="field">Password
          <input name="password" type="password" autocomplete="current-password" required maxlength="128">
        </label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
      <p class="hint">Demo accounts: <strong>admin</strong> / Admin@123 · <strong>hr</strong> / Hr@12345</p>
    </div>
  </main>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
